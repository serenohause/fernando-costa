<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Backoffice inteiro: nenhuma página deve ser indexada, e a rota do
         formulário público carrega o token do cliente na URL. -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- Título neutro de propósito: o nome do escritório é dado do tenant e
         entra pelo AppLayout quando a sessão resolve. Escrito aqui, ele seria o
         nome do escritório errado na aba de todo tenant que não fosse o
         primeiro. -->
    <title>Backoffice</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
